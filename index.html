<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodo 90s Melodies</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        :root {
            --vintage-gold: #d4a373;
            --dokhona-yellow: #ffb703;
            --paper: #fefae0;
            --glass: rgba(0, 0, 0, 0.7);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a0f00;
            color: var(--paper);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- DUAL BACKGROUND LOGIC --- */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
            
            /* DEFAULT: Computer/Desktop Image */
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('desktop-bg.jpg');
        }

        /* MOBILE VIEW (Screens smaller than 768px) */
        @media (max-width: 768px) {
            .bg-overlay {
                /* Mobile specific vertical image */
                background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('mobile-bg.jpg');
            }
            
            .container { margin-top: -30px; }
            .player-bar { width: 95%; bottom: 20px; padding: 12px; }
        }

        /* Visual Elements */

        .grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Resolution_White_Noise_Video_Frame.png');
            opacity: 0.04; pointer-events: none; z-index: 100;
        }

        .container { text-align: center; z-index: 10; width: 90%; }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(2.5rem, 10vw, 5rem);
            color: var(--dokhona-yellow);
            text-shadow: 3px 3px 10px rgba(0,0,0,0.9);
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }

        /* Cassette Styling */
        .visual-center {
            position: relative;
            width: clamp(220px, 65vw, 300px);
            height: clamp(140px, 42vw, 190px);
            background: #1a1a1a;
            margin: 0 auto;
            border-radius: 12px;
            border: 5px solid #333;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }

        .cassette-label {
            width: 85%; height: 75%;
            background: var(--vintage-gold);
            border-radius: 4px; padding: 10px;
            color: #222; font-weight: bold; font-size: 0.6rem;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .spool {
            width: clamp(30px, 8vw, 38px);
            height: clamp(30px, 8vw, 38px);
            background: #111; border-radius: 50%;
            border: 3px dashed #666;
            animation: rotate 4s linear infinite;
            animation-play-state: paused;
        }

        .playing .spool { animation-play-state: running; }

        #quote-box {
            height: 60px; margin-top: 25px;
            font-size: clamp(0.85rem, 3.5vw, 1rem);
            text-shadow: 1px 1px 3px #000;
        }

        /* Bottom Player Bar */
        .player-bar {
            position: fixed;
            bottom: 30px;
            width: 90%; max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 15px;
            display: flex; align-items: center; gap: 15px;
            z-index: 1000;
        }

        .controls { display: flex; gap: 10px; }
        .btn { background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; }
        .track-info { flex-grow: 1; overflow: hidden; }
        #now-playing { font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        
        .progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        .progress-bar { width: 0%; height: 100%; background: var(--dokhona-yellow); }

        #youtube-player { position: absolute; top: -1000px; visibility: hidden; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    <div class="grain"></div>

    <div class="container">
        <h1>BODO 90's</h1>
        <p class="subtitle">"TULUNGA BRAHMA"</p>

        <div class="visual-center" id="cassette" onclick="togglePlay()">
            <div class="cassette-label">
                <div>90's GOLD HITS</div>
                <div style="display: flex; justify-content: space-around;">
                    <div class="spool"></div>
                    <div class="spool"></div>
                </div>
                <div style="text-align: right; font-size: 0.5rem;">BODO PRIDE</div>
            </div>
        </div>

        <div id="quote-box">Loading Bodo memories...</div>
    </div>

    <div id="youtube-player">
        <div id="player"></div>
    </div>

    <div class="player-bar">
        <div class="controls">
            <button class="btn" onclick="prevVideo()">⏮</button>
            <button class="btn" id="play-trigger" onclick="togglePlay()">▶</button>
            <button class="btn" onclick="nextVideo()">⏭</button>
        </div>
        <div class="track-info">
            <div id="now-playing">Tap Cassette to Play</div>
            <div class="progress-container" onclick="seek(event)">
                <div class="progress-bar" id="progress"></div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const quotes = [
    "Remembering the rainy days in the village...",
    "Listening to Sulekha Basumatary on a battery radio.",
    "The smell of fresh Goy-Pathwi and the sound of Bwisagu.",
    "Angni khontai... angni methai...",
    "Aronai gwnang methai...",
    "Those evenings when the whole village gathered under one roof.",
    "A battery radio, a cup of tea, and songs from another time.",
    "Remembering the days when every song had a story.",
    "The sound of music drifting through the quiet village nights.",
    "Old melodies, old memories, forever close to the heart.",
    "When Bodo songs played softly in the evening air.",
    "Those simple days... when happiness needed very little.",
    "A cassette turning slowly, carrying memories from the 90s.",
    "Before smartphones, we waited for our favourite songs on the radio.",
    "Rain outside, music inside, and the whole evening ahead.",
    "The golden days of Bodo music still echo in our hearts.",
    "From village courtyards to old cassette players...",
    "Some melodies never grow old.",
    "Those Bwisagu nights still feel like yesterday.",
    "The songs changed, but the memories stayed.",
    "Remembering the voices that filled our childhood homes.",
    "A little Aronai, a little music, and a lot of memories.",
    "90s Bodo music... where every melody felt like home.",
    "When the village was quiet, the cassette player spoke.",
    "Old songs. Old voices. Timeless memories.",
    "The rhythm of the drum, the warmth of the village, the soul of Bodo music.",
    "Back to the days when music was shared, not streamed.",
    "Somewhere between an old cassette and a rainy evening...",
    "Our childhood had a soundtrack — Bodo music.",
    "For those who grew up with these melodies, the memories never fade."
];


        let qIdx = 0;
        setInterval(() => {
            qIdx = (qIdx + 1) % quotes.length;
            document.getElementById('quote-box').innerText = `"${quotes[qIdx]}"`;
        }, 5000);

        let player;
        let isPlaying = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0', width: '0',
                playerVars: {
                    'listType': 'playlist',
                    'list': 'PLJCFKOaS74GQ'
                },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            const cassette = document.getElementById('cassette');
            const btn = document.getElementById('play-trigger');
            if (event.data == YT.PlayerState.PLAYING) {
                cassette.classList.add('playing');
                btn.innerText = '⏸';
                isPlaying = true;
                document.getElementById('now-playing').innerText = player.getVideoData().title;
            } else {
                cassette.classList.remove('playing');
                btn.innerText = '▶';
                isPlaying = false;
            }
        }

        function togglePlay() { isPlaying ? player.pauseVideo() : player.playVideo(); }
        function nextVideo() { player.nextVideo(); }
        function prevVideo() { player.previousVideo(); }

        setInterval(() => {
            if (player && isPlaying) {
                let perc = (player.getCurrentTime() / player.getDuration()) * 100;
                document.getElementById('progress').style.width = perc + '%';
            }
        }, 1000);

        function seek(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            player.seekTo(player.getDuration() * ((event.clientX - rect.left) / rect.width));
        }
    </script>
</body>
</html>
